services:
  django:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput && \
             gunicorn \
               --bind 0.0.0.0:8000 \
               --workers 3 \
               --timeout 120 \
               --access-logfile - \
               --error-logfile - \
               config.wsgi:application"
    volumes:
      - .:/app
      - sqlite_data:/app/db_data
      - static_files:/app/staticfiles
    env_file: .env
    depends_on: [redis]
    expose: ["8000"]

  celery:
    build: .
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis, django]

  recommendations:
    build: ./microservices/recommendations
    expose: ["5001"]
    env_file: .env
    environment:
      - THIRD_PARTY_COUNTRY_API=https://restcountries.com/v3.1/alpha

  redis:
    image: redis:7-alpine
    expose: ["6379"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on: [django, recommendations]

volumes:
  sqlite_data:
  static_files: